name: Sync GXU Graduate Schedule

on:
  schedule:
    # 每天北京时间 06:00、09:00、12:00、15:00、18:00、21:00 自动抓取并发布
    - cron: '0 22,1,4,7,10,13 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sms_code:
        description: '如触发短信验证可在此填入验证码（可选）'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run GXU schedule sync
        if: github.event_name != 'push'
        env:
          GXU_USERNAME: ${{ secrets.GXU_USERNAME }}
          GXU_PASSWORD: ${{ secrets.GXU_PASSWORD }}
          VIEW_PASSWORD: ${{ secrets.VIEW_PASSWORD }}
          GXU_COOKIE: ${{ secrets.GXU_COOKIE }}
          TERM_START: ${{ vars.TERM_START || '2026-09-07' }}
          SMS_CODE: ${{ github.event.inputs.sms_code }}
        run: python sync_gxu.py

      - name: Commit and push updated schedule.json
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "课表无变化，跳过提交"
          else
            git commit -m "chore: auto-sync GXU schedule"
            git push
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html schedule.json _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "课表无变化，跳过提交"
          else
            git commit -m "chore: auto-sync GXU schedule"
            git push
          fi
