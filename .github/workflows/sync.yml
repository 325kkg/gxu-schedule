name: Sync GXU Graduate Schedule

on:
  schedule:
    # 每天北京时间 06:00 自动运行一次（UTC 22:00）
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      sms_code:
        description: '如触发短信验证可在此填入验证码（可选）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run GXU schedule sync
        env:
          GXU_USERNAME: ${{ secrets.GXU_USERNAME }}
          GXU_PASSWORD: ${{ secrets.GXU_PASSWORD }}
          GXU_COOKIE: ${{ secrets.GXU_COOKIE }}
          TERM_START: ${{ vars.TERM_START || '2026-09-07' }}
          SMS_CODE: ${{ github.event.inputs.sms_code }}
        run: python sync_gxu.py

      - name: Commit and push updated schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "课表无变化，跳过提交"
          else
            git commit -m "chore: auto-sync GXU schedule"
            git push
          fi
